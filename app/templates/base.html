<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFFFF">
    <title>{% block title %}딜사이트 News Clipper{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/img/dealsite-icon.png">
    <link rel="apple-touch-icon" href="/static/img/dealsite-icon.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" as="style" crossorigin
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">
                <img src="/static/img/dealsite-logo.png" alt="DealSite" class="logo-mark" width="62" height="20">
                <span class="logo-divider"></span>
                <span class="logo-text">News Clipper</span>
            </a>
            <div class="nav-right">
                <a href="/setup" title="설정">
                    <span class="nav-label">설정</span>
                </a>
            </div>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>DealSite Daily News Clipping &middot; Powered by AI</p>
    </footer>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
